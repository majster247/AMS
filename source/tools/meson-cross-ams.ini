; Meson cross-compilation file for the AMS-OS userspace.
; Used by tools/wayland_build.sh when invoking meson on Mesa, wlroots, ...
;
; The cross toolchain is the same x86_64-elf-{gcc,g++} we use for the
; AMS userspace ELFs (see Makefile USER_CFLAGS). Pkg-config is wired to
; the staged sysroot so libwayland finds libffi, wlroots finds mesa, etc.

[binaries]
c           = 'x86_64-elf-gcc'
cpp         = 'x86_64-elf-g++'
ar          = 'x86_64-elf-ar'
strip       = 'x86_64-elf-strip'
pkg-config  = 'pkg-config'
nasm        = 'nasm'

[built-in options]
c_args      = ['-ffreestanding', '-fno-stack-protector', '-mno-red-zone',
               '-D__AMS_OS__=1', '-D_DEFAULT_SOURCE',
               '-isystem', '@SYSROOT@/usr/include',
               '-I@SOURCE_ROOT@/include',
               '-I@SOURCE_ROOT@/include/libports']
cpp_args    = ['-ffreestanding', '-fno-rtti', '-fno-exceptions',
               '-fno-stack-protector', '-mno-red-zone',
               '-D__AMS_OS__=1', '-D_DEFAULT_SOURCE',
               '-isystem', '@SYSROOT@/usr/include',
               '-I@SOURCE_ROOT@/include',
               '-I@SOURCE_ROOT@/include/libports']
c_link_args = ['-nostdlib', '-static', '-Wl,-T,@SOURCE_ROOT@/src/gui/apps/user.ld',
               '-L@SYSROOT@/usr/lib', '-lports']

[host_machine]
system     = 'ams-os'
cpu_family = 'x86_64'
cpu        = 'x86_64'
endian     = 'little'
